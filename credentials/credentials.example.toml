# ============================================================
# 🔑 CREDENTIALS VAULT — Fill once, AI autonomous forever
# ============================================================
# WARNING: COPY this file to credentials.toml then fill in real values
#   cp credentials/credentials.example.toml credentials/credentials.toml
# File credentials.toml MUST NEVER be committed to Git!
# ============================================================

# ─── AUTONOMY LEVEL ─────────────────────────────────────────
[autonomy]
level = 3                    # 1=report, 2=fix+PR, 3=full auto (DEFAULT)
auto_merge_labels = ["ai-fix-verified", "tests-passed"]
max_auto_fix_per_day = 0     # 0 = unlimited
blocked_paths = ["database/migrations/", "envs/", "credentials/"]

# ─── GITHUB ──────────────────────────────────────────────────
[github]
personal_access_token = ""   # ghp_xxxx (scopes: repo, workflow, packages)
username = ""                # e.g., chithanh85
default_org = ""             # e.g., my-org (if applicable)
# Used for: Issues, PRs, merge, trigger workflows, releases

# ─── SSH SERVERS ─────────────────────────────────────────────
[ssh]
default_key_path = "~/.ssh/id_ed25519"
known_hosts_path = "~/.ssh/known_hosts"

  [ssh.servers.production]
  host = ""                  # e.g., 100.68.49.29
  user = ""                  # e.g., deploy
  port = 22
  key_path = ""              # Override if different from default

  [ssh.servers.staging]
  host = ""
  user = ""
  port = 22

# ─── CLOUDFLARE ──────────────────────────────────────────────
[cloudflare]
api_token = ""               # Cloudflare API Token
account_id = ""              # Cloudflare Account ID
# Used for: Deploy Workers, DNS management, D1, R2, Vectorize

# ─── SECOND BRAIN (AI MEMORY v2.0) ────────────────────────────
[second_brain]
url = "https://second-brain.your-subdomain.workers.dev"
auth_token = "your-secret-token-here"
# Used for: MCP remember/recall/link/connections, Memory Graph, persistent memory

# ─── DATABASE ────────────────────────────────────────────────
[database.local]
url = "postgresql://postgres:postgres@localhost:5432/myapp"

[database.production]
url = ""                     # Production DB connection string
# WARNING: AI is READ-ONLY on production

# ─── DOCKER REGISTRY ─────────────────────────────────────────
[docker]
registry = "ghcr.io"        # or docker.io, registry.digitalocean.com
username = ""
token = ""                  # ghp_xxxx or Docker Hub token

# ─── GOOGLE CLOUD / FIREBASE ─────────────────────────────────
[google]
service_account_json_path = ""
project_id = ""
# Used for: Firebase, GCS, Cloud Run, Vertex AI

# ─── SUPABASE ────────────────────────────────────────────────
[supabase]
project_url = ""             # e.g., https://xxxx.supabase.co
anon_key = ""
service_role_key = ""        # Server-side only, NEVER expose to client
db_password = ""

# ─── VERCEL ──────────────────────────────────────────────────
[vercel]
token = ""                   # Vercel Personal Access Token
org_id = ""
project_id = ""

# ─── MONITORING ──────────────────────────────────────────────
[monitoring]
sentry_dsn = ""              # Sentry error tracking DSN

# ─── DOMAIN / DNS ────────────────────────────────────────────
[domain]
registrar = ""               # e.g., cloudflare, namecheap, google
primary_domain = ""          # e.g., myapp.com

# ─── AI SERVICES (for AI PR Review & Codex) ──────────────────
[ai]
gemini_api_key = ""          # Primary Gemini API key
gemini_api_key_2 = ""        # Backup key (rate limit rotation)
gemini_api_key_3 = ""        # Optional third key
openai_api_key = ""          # For Codex, GPT API
anthropic_api_key = ""       # For Claude API

# ─── TELEGRAM (Teleport Bridge) ───────────────────────────────
# Used by all agents (Antigravity, Claude Code, Codex) to send
# progress reports and receive instructions while user is AFK.
# Setup: /setup-teleport | Full guide: ../teleport/rules/telegram-guide.md
[telegram]
bot_token = ""               # From @BotFather → /newbot  e.g. 8782121519:AAE...
admin_chat_id = ""           # Your personal chat ID from @userinfobot
# For group chat: negative number e.g. -100123456789 (get via @RawDataBot)

# IMPORTANT: These values go into ../teleport/.env (NOT this file)
# ../teleport/ must be a sibling of this project directory:
#   ~/Projects/
#     ├── teleport/   ← bot_token & admin_chat_id go HERE in .env
#     └── this-project/
#
# Once configured, say "tele me" to any agent to activate reporting.
