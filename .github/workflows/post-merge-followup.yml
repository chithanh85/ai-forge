name: Post-merge Deploy Follow-up

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          echo "🏥 Running post-deploy health check..."
          # Customize this URL for your production endpoint
          # curl -sf https://api.yourapp.com/health || exit 1
          echo "✅ Health check passed (configure your endpoint)"

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Post-deploy health check failed',
              body: `Deploy from commit ${context.sha} failed health check.\n\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ai-detected', 'priority:critical', 'deploy-failure']
            });
