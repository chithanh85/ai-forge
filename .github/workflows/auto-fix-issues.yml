name: Auto-Fix AI Review Issues

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    # Only trigger when 'auto-fixable' label is added
    if: github.event.label.name == 'auto-fixable'
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract issue metadata & fix
        id: fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          LLM_MODEL: gemini-2.5-flash
        run: node scripts/ci/auto-fix-issue.mjs

      - name: Create Pull Request
        if: steps.fix.outputs.fixed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          BRANCH="fix/ai-issue-${ISSUE_NUM}"

          git config user.name "AI Auto-Fixer"
          git config user.email "ai@aiforge.dev"

          git checkout -b "${BRANCH}"
          git add -A
          git commit -m "🤖 Fixes #${ISSUE_NUM}: auto-fix from AI Review"
          git push origin "${BRANCH}"

          gh pr create \
            --title "🤖 Auto-fix #${ISSUE_NUM}: ${{ github.event.issue.title }}" \
            --body "Fixes #${ISSUE_NUM}

          ## Auto-fixed by AI Agent

          This PR was automatically generated by the AI Auto-Fixer workflow.
          The original issue was created by AI PR Review.

          **Please review the changes before merging.**

          ---
          _🤖 Auto-generated. Self-hosted runner with local codebase context._" \
            --label "ai-auto-fix"

      - name: Comment on issue
        if: steps.fix.outputs.fixed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=${{ github.event.issue.number }}
          BRANCH="fix/ai-issue-${ISSUE_NUM}"
          gh issue comment ${ISSUE_NUM} --body "🤖 Auto-fix PR created: branch \`${BRANCH}\`. Please review and merge to close this issue."

      - name: Comment on failure
        if: steps.fix.outputs.fixed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "⚠️ AI Auto-Fixer could not resolve this issue automatically. Manual intervention required."
          gh issue edit ${{ github.event.issue.number }} --remove-label "auto-fixable" --add-label "needs-human"
