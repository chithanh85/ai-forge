name: AI PR Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-pr-review:
    if: github.event.pull_request.draft == false
    # Self-hosted runner = FREE. Multi-key Gemini rotation.
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run AI PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEY_2: ${{ secrets.LLM_API_KEY_2 }}
          LLM_API_KEY_3: ${{ secrets.LLM_API_KEY_3 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REVIEW_MODE: advisory
          LLM_PROVIDER: google
          LLM_MODEL: gemini-2.5-flash
          AI_PR_REVIEW_REQUEST_DELAY_MS: "6500"
          AI_PR_REVIEW_MAX_FILES: "5"
          AI_PR_REVIEW_MAX_LLM_ATTEMPTS: "2"
          AI_PR_REVIEW_MAX_TOTAL_COMMENTS: "30"
          AI_PR_REVIEW_CREATE_ISSUES: "true"
          AI_PR_REVIEW_MAX_ISSUES_PER_RUN: "3"
        run: node scripts/ci/ai-pr-review.mjs
