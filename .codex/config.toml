# Codex CLI Configuration
# Dành cho OpenAI Codex CLI — đọc AGENTS.md để biết quy tắc chung.

[project]
name = "{{AWF_PROJECT_NAME}}"

# Model selection is client/user-owned. AWF defines capability requirements, not vendor model pins.
model_reasoning_effort = "high"

# Sandbox — giới hạn quyền truy cập
sandbox_mode = ":workspace"

# Approval policy — yêu cầu duyệt khi thao tác nguy hiểm
approval_policy = "on-failure"

# Hooks — chạy trước/sau các hành động của Codex
[hooks]
pre-commit = "npx lint-staged"
pre-push = "npm test"
